<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foco</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">FOCO</p>
            <h1>🎯 Foco</h1>
            <p class="subtitle">
                Escolha uma ação e execute.
            </p>
        </header>


        <section class="modules">

            <!-- O QUE VOU FAZER -->

            <div class="module-card">
                <span class="icon">🎯</span>
                <div>
                    <h2>O que vou fazer?</h2>

                    <input
                        type="text"
                        id="tarefaFoco"
                        placeholder="Tarefa ou prioridade do dia"
                    >
                </div>
            </div>


            <!-- SESSÃO -->

            <div class="module-card">
                <span class="icon">⏱️</span>
                <div>
                    <h2>Sessão de foco</h2>

                    <select id="tempoFoco">
                        <option value="15">15 minutos</option>
                        <option value="25">25 minutos</option>
                        <option value="30">30 minutos</option>
                        <option value="50" selected>50 minutos</option>
                        <option value="90">90 minutos</option>
                    </select>

                    <p
                        id="displayTimer"
                        style="
                            font-size: 52px;
                            text-align: center;
                            margin: 22px 0 10px;
                            font-variant-numeric: tabular-nums;
                            letter-spacing: 2px;
                        "
                    >
                        50:00
                    </p>

                    <!-- Barra de progresso -->

                    <div
                        style="
                            width: 100%;
                            height: 8px;
                            background: #eee;
                            border-radius: 4px;
                            overflow: hidden;
                            margin-bottom: 20px;
                        "
                    >
                        <div
                            id="barraProgresso"
                            style="
                                height: 100%;
                                width: 0%;
                                background: #333;
                                transition: width 0.4s ease;
                            "
                        ></div>
                    </div>

                    <div style="display: flex; gap: 10px;">

                        <button
                            type="button"
                            id="btnIniciar"
                            style="
                                flex: 1;
                                padding: 12px;
                                font-size: 16px;
                                cursor: pointer;
                                border: 1px solid #ccc;
                                border-radius: 8px;
                                background: #fff;
                            "
                        >
                            ▶️ Iniciar
                        </button>

                        <button
                            type="button"
                            id="btnReiniciar"
                            title="Reiniciar"
                            style="
                                padding: 12px 16px;
                                font-size: 16px;
                                cursor: pointer;
                                border: 1px solid #ccc;
                                border-radius: 8px;
                                background: #fff;
                            "
                        >
                            🔄
                        </button>

                    </div>

                    <!-- Ações ao terminar -->

                    <div id="acoesFim" style="display:none; margin-top: 14px;">
                        <button
                            type="button"
                            id="btnNovoFoco"
                            style="
                                width: 100%;
                                padding: 12px;
                                font-size: 16px;
                                cursor: pointer;
                                border: 1px solid #333;
                                border-radius: 8px;
                                background: #333;
                                color: #fff;
                            "
                        >
                            ▶️ Iniciar novo foco
                        </button>
                    </div>

                </div>
            </div>


            <!-- DISTRAÇÕES -->

            <div class="module-card">
                <span class="icon">🚫</span>
                <div>
                    <h2>Distrações</h2>

                    <p style="color:#888; font-size:14px; margin-bottom:10px;">
                        Anote o que apareceu na cabeça e continue.
                        <span
                            id="contadorDistracoes"
                            style="
                                display: inline-block;
                                margin-left: 6px;
                                padding: 2px 8px;
                                background: #f0f0f0;
                                border-radius: 10px;
                                font-size: 12px;
                                color: #555;
                            "
                        >
                            Hoje: 0
                        </span>
                    </p>

                    <div style="display: flex; gap: 8px;">

                        <input
                            type="text"
                            id="inputDistracao"
                            placeholder="Ex.: pesquisar câmera para celular"
                            style="flex: 1;"
                        >

                        <button
                            type="button"
                            id="btnAddDistracao"
                            style="
                                padding: 8px 16px;
                                font-size: 18px;
                                cursor: pointer;
                                border: 1px solid #ccc;
                                border-radius: 8px;
                                background: #fff;
                            "
                        >
                            +
                        </button>

                    </div>

                    <ul
                        id="listaDistracoes"
                        style="
                            list-style: none;
                            padding: 0;
                            margin-top: 14px;
                        "
                    ></ul>
                </div>
            </div>


            <!-- NOTAS -->

            <div class="module-card">
                <span class="icon">📝</span>
                <div>
                    <h2>Notas da sessão</h2>

                    <textarea
                        id="notasFoco"
                        placeholder="Anotações enquanto executa."
                        rows="5"
                    ></textarea>
                </div>
            </div>


            <!-- PAUSA -->

            <div class="module-card">
                <span class="icon">⏸️</span>
                <div>
                    <h2>Pausa</h2>

                    <p style="color:#888; font-size:14px; margin-bottom:14px;">
                        Escolha uma categoria e faça algo consciente.
                    </p>

                    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom:18px;">

                        <button type="button" class="btn-pausa" data-cat="curta">
                            ⚡ Pausa curta
                        </button>

                        <button type="button" class="btn-pausa" data-cat="longa">
                            🌿 Pausa longa
                        </button>

                        <button type="button" class="btn-pausa" data-cat="tarefas">
                            🔄 Entre tarefas
                        </button>

                        <button type="button" class="btn-pausa" data-cat="semNada">
                            🕳️ Sem fazer nada
                        </button>

                    </div>

                    <div id="listaPausas"></div>

                    <button
                        type="button"
                        id="btnSorteio"
                        style="
                            margin-top: 16px;
                            padding: 12px;
                            width: 100%;
                            font-size: 16px;
                            cursor: pointer;
                            border: 1px solid #ccc;
                            border-radius: 8px;
                            background: #fff;
                        "
                    >
                        🎲 Escolher por mim
                    </button>

                    <div
                        id="resultadoSorteio"
                        style="
                            margin-top: 14px;
                            padding: 14px;
                            border-radius: 8px;
                            background: #f5f5f5;
                            font-size: 16px;
                            display: none;
                        "
                    ></div>

                </div>
            </div>

        </section>


        <a href="../../index.html" class="back-button">
            ← Voltar para o início
        </a>

    </main>


    <style>
        .btn-pausa {
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 20px;
            background: #fff;
        }

        .btn-pausa.ativo {
            background: #333;
            color: #fff;
            border-color: #333;
        }

        .item-pausa {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }
    </style>


    <script>
        // ==================================================
        // DATA ATUAL
        // ==================================================

        const hoje = new Date();

        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, "0");
        const dia = String(hoje.getDate()).padStart(2, "0");

        const dataAtual = `${ano}-${mes}-${dia}`;


        // ==================================================
        // CHAVES
        // ==================================================

        const chaveTarefa     = `planejamento_${dataAtual}_foco_tarefa`;
        const chaveTempo      = `planejamento_${dataAtual}_foco_tempo`;
        const chaveNotas      = `planejamento_${dataAtual}_foco_notas`;
        const chaveDistancias = `planejamento_${dataAtual}_foco_distancias`;
        const chaveSessoes    = `planejamento_${dataAtual}_foco_sessoes`;
        const chaveEstado     = `planejamento_${dataAtual}_foco_estado`;


        // ==================================================
        // BIBLIOTECA DE PAUSAS
        // ==================================================

        const pausas = {

            curta: [
                "💧 Beber água",
                "🚶 Caminhar pela casa",
                "👀 Descansar os olhos",
                "🧘 Fazer respiração profunda",
                "🚽 Ir ao banheiro",
                "🪟 Ir até uma janela e olhar para longe",
                "🤸 Alongar o corpo",
                "🧍 Ficar alguns minutos em pé",
                "🧹 Organizar rapidamente a mesa",
                "🗑️ Jogar algo fora",
                "🌿 Ir para uma área externa",
                "😮‍💨 Fazer uma pausa sem tela",
                "🧼 Lavar o rosto",
                "☀️ Tomar um pouco de sol",
                "🧠 Ficar alguns minutos em silêncio",
                "📝 Anotar algo que está incomodando",
                "🎵 Ouvir uma música",
                "🐕 Interagir rapidamente com um animal de estimação",
                "👕 Arrumar a roupa/ambiente",
                "🙏 Fazer uma oração curta"
            ],

            longa: [
                "🍽️ Fazer uma refeição",
                "🚿 Tomar banho",
                "🚶 Fazer uma caminhada",
                "🎵 Ouvir música",
                "📖 Ler algumas páginas",
                "🧘 Meditar",
                "🙏 Fazer um momento com Deus",
                "🏃 Fazer uma atividade física leve",
                "☕ Preparar e tomar um café",
                "🌳 Ficar um tempo ao ar livre",
                "🧹 Organizar o quarto",
                "🧺 Organizar roupas",
                "🍳 Preparar alguma comida",
                "🗣️ Conversar com alguém",
                "🎨 Fazer uma atividade criativa",
                "✍️ Escrever livremente",
                "😴 Tirar um descanso breve",
                "🧩 Fazer um hobby",
                "📵 Ficar longe do celular",
                "🌅 Simplesmente sentar e descansar"
            ],

            tarefas: [
                "💾 Salvar o trabalho",
                "📁 Organizar os arquivos usados",
                "📝 Registrar onde parou",
                "🎯 Definir a próxima ação",
                "🧹 Limpar a mesa",
                "💧 Beber água",
                "🚶 Levantar e caminhar",
                "👀 Descansar os olhos",
                "🧘 Respirar profundamente",
                "📋 Conferir o que foi concluído",
                "🗑️ Fechar arquivos desnecessários",
                "🖥️ Fechar programas que não serão usados",
                "📱 Guardar o celular",
                "🧠 Esvaziar a cabeça por alguns minutos",
                "📝 Registrar uma ideia que surgiu",
                "⏱️ Definir o próximo bloco de foco",
                "🎯 Relembrar o objetivo da próxima tarefa",
                "🪑 Ajustar o ambiente de trabalho",
                "🌿 Ir rapidamente para outro ambiente",
                "▶️ Começar imediatamente a próxima ação"
            ],

            semNada: [
                "📖 Ler um capítulo",
                "🎓 Fazer uma aula",
                "🧠 Estudar um conceito",
                "📚 Pesquisar um assunto",
                "📝 Fazer anotações",
                "🗣️ Praticar comunicação",
                "🇺🇸 Estudar inglês",
                "💼 Estudar vendas",
                "📈 Estudar marketing",
                "💻 Aprender uma habilidade",
                "🚶 Caminhar",
                "🏃 Fazer cardio",
                "🤸 Alongar",
                "🏋️ Fazer um treino",
                "🧘 Relaxar o corpo",
                "💡 Desenvolver uma ideia",
                "🎬 Criar uma ideia de conteúdo",
                "✍️ Escrever",
                "🛠️ Trabalhar em um projeto pessoal",
                "🔬 Fazer uma pesquisa útil"
            ]

        };


        // ==================================================
        // ELEMENTOS
        // ==================================================

        const tarefaFoco       = document.getElementById("tarefaFoco");
        const tempoFoco        = document.getElementById("tempoFoco");
        const displayTimer     = document.getElementById("displayTimer");
        const barraProgresso   = document.getElementById("barraProgresso");
        const btnIniciar       = document.getElementById("btnIniciar");
        const btnReiniciar     = document.getElementById("btnReiniciar");
        const btnNovoFoco      = document.getElementById("btnNovoFoco");
        const acoesFim         = document.getElementById("acoesFim");
        const inputDistracao   = document.getElementById("inputDistracao");
        const btnAddDistracao  = document.getElementById("btnAddDistracao");
        const listaDistracoes  = document.getElementById("listaDistracoes");
        const contadorDistracoes = document.getElementById("contadorDistracoes");
        const notasFoco        = document.getElementById("notasFoco");
        const listaPausas      = document.getElementById("listaPausas");
        const btnSorteio       = document.getElementById("btnSorteio");
        const resultadoSorteio = document.getElementById("resultadoSorteio");


        // ==================================================
        // CARREGAR VALORES SALVOS
        // ==================================================

        tarefaFoco.value = localStorage.getItem(chaveTarefa) || "";
        notasFoco.value  = localStorage.getItem(chaveNotas)  || "";

        const tempoSalvo = localStorage.getItem(chaveTempo);
        if (tempoSalvo) {
            tempoFoco.value = tempoSalvo;
        }


        // ==================================================
        // TIMER — ESTADO
        // ==================================================

        let rodando          = false;
        let duracaoTotal     = Number(tempoFoco.value) * 60;
        let segundosRestantes = duracaoTotal;
        let inicioSessao     = null;
        let intervalId       = null;
        let wakeLock         = null;


        function formatarTempo(segundos) {

            const m = String(Math.floor(segundos / 60)).padStart(2, "0");
            const s = String(segundos % 60).padStart(2, "0");

            return `${m}:${s}`;
        }


        function atualizarDisplay() {
            displayTimer.textContent = formatarTempo(segundosRestantes);
        }


        function atualizarBarra() {

            const pct = duracaoTotal > 0
                ? ((duracaoTotal - segundosRestantes) / duracaoTotal) * 100
                : 0;

            barraProgresso.style.width = pct + "%";
        }


        function atualizarTitulo() {

            if (rodando) {
                document.title = `⏱️ ${formatarTempo(segundosRestantes)} — Foco`;
            } else {
                document.title = "Foco";
            }
        }


        // ==================================================
        // ESTADO PERSISTENTE
        // ==================================================

        function salvarEstado() {

            localStorage.setItem(chaveEstado, JSON.stringify({
                rodando: rodando,
                inicio: inicioSessao,
                duracao: duracaoTotal,
                restante: segundosRestantes
            }));

        }


        function limparEstado() {
            localStorage.removeItem(chaveEstado);
        }


        function restaurarEstado() {

            let salvo = null;

            try {
                salvo = JSON.parse(localStorage.getItem(chaveEstado));
            } catch (e) {
                salvo = null;
            }

            if (!salvo || typeof salvo !== "object") return;

            if (salvo.duracao) {

                duracaoTotal = salvo.duracao;

                const min = duracaoTotal / 60;
                const opt = Array.from(tempoFoco.options)
                    .find(o => Number(o.value) === min);

                if (opt) tempoFoco.value = String(min);

            }

            if (salvo.rodando && salvo.inicio) {

                const decorrido = Math.floor((Date.now() - salvo.inicio) / 1000);
                const restante = duracaoTotal - decorrido;

                if (restante > 0) {

                    segundosRestantes = restante;
                    inicioSessao = salvo.inicio;
                    rodando = true;

                    btnIniciar.textContent = "⏸️ Pausar";

                } else {

                    segundosRestantes = duracaoTotal;

                }

            } else if (typeof salvo.restante === "number") {

                segundosRestantes = Math.max(
                    0,
                    Math.min(salvo.restante, duracaoTotal)
                );

                if (segundosRestantes < duracaoTotal) {
                    btnIniciar.textContent = "▶️ Continuar";
                }

            }

        }


        // ==================================================
        // SOM, NOTIFICAÇÃO, WAKE LOCK
        // ==================================================

        function tocarBipe() {

            try {

                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator();
                const g = ctx.createGain();

                o.connect(g);
                g.connect(ctx.destination);

                o.type = "sine";
                o.frequency.value = 880;

                g.gain.setValueAtTime(0.3, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(
                    0.0001,
                    ctx.currentTime + 1
                );

                o.start();
                o.stop(ctx.currentTime + 1);

            } catch (e) {}

        }


        function pedirPermissaoNotificacao() {

            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }

        }


        function mostrarNotificacao() {

            if ("Notification" in window && Notification.permission === "granted") {

                try {
                    new Notification("⏱️ Sessão concluída!", {
                        body: "Faça uma pausa consciente."
                    });
                } catch (e) {}

            }

        }


        async function ativarWakeLock() {

            try {

                if ("wakeLock" in navigator) {
                    wakeLock = await navigator.wakeLock.request("screen");
                }

            } catch (e) {}

        }


        function liberarWakeLock() {

            if (wakeLock) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }

        }


        // ==================================================
        // REGISTRAR SESSÃO
        // ==================================================

        function registrarSessao(tarefa, duracaoSegundos) {

            let sessoes = [];

            try {
                sessoes = JSON.parse(localStorage.getItem(chaveSessoes)) || [];
            } catch (e) {
                sessoes = [];
            }

            sessoes.push({
                tarefa: tarefa || "(sem tarefa)",
                duracao: duracaoSegundos,
                hora: new Date().toISOString()
            });

            localStorage.setItem(chaveSessoes, JSON.stringify(sessoes));

        }


        // ==================================================
        // AÇÕES DE FIM
        // ==================================================

        function mostrarAcoesFim() {
            acoesFim.style.display = "block";
        }


        function esconderAcoesFim() {
            acoesFim.style.display = "none";
        }


        // ==================================================
        // CICLO DO TIMER
        // ==================================================

        function tick() {

            segundosRestantes--;

            if (segundosRestantes < 0) segundosRestantes = 0;

            atualizarDisplay();
            atualizarBarra();
            atualizarTitulo();
            salvarEstado();

            if (segundosRestantes === 0) {
                finalizarSessao();
            }

        }


        function iniciarTimer() {

            // Pausar
            if (rodando) {

                clearInterval(intervalId);
                rodando = false;
                btnIniciar.textContent = "▶️ Continuar";

                salvarEstado();
                liberarWakeLock();
                atualizarTitulo();

                return;
            }

            // Reinicia do total se já acabou
            if (segundosRestantes <= 0) {
                segundosRestantes = duracaoTotal;
            }

            rodando = true;
            inicioSessao = Date.now() - (duracaoTotal - segundosRestantes) * 1000;
            btnIniciar.textContent = "⏸️ Pausar";

            esconderAcoesFim();

            pedirPermissaoNotificacao();
            ativarWakeLock();

            salvarEstado();
            atualizarTitulo();

            intervalId = setInterval(tick, 1000);

        }


        function finalizarSessao() {

            clearInterval(intervalId);
            rodando = false;
            btnIniciar.textContent = "▶️ Iniciar";

            liberarWakeLock();
            document.title = "Foco";

            registrarSessao(tarefaFoco.value.trim(), duracaoTotal);

            tocarBipe();
            mostrarNotificacao();
            mostrarAcoesFim();

            limparEstado();

        }


        function resetTimer() {

            clearInterval(intervalId);
            rodando = false;
            btnIniciar.textContent = "▶️ Iniciar";

            duracaoTotal = Number(tempoFoco.value) * 60;
            segundosRestantes = duracaoTotal;
            inicioSessao = null;

            atualizarDisplay();
            atualizarBarra();
            document.title = "Foco";
            esconderAcoesFim();

            limparEstado();
            liberarWakeLock();

        }


        btnIniciar.addEventListener("click", iniciarTimer);
        btnReiniciar.addEventListener("click", resetTimer);

        btnNovoFoco.addEventListener("click", () => {
            resetTimer();
            tarefaFoco.focus();
        });


        // ==================================================
        // SALVAMENTO AUTOMÁTICO
        // ==================================================

        tarefaFoco.addEventListener("input", () => {
            localStorage.setItem(chaveTarefa, tarefaFoco.value);
        });

        notasFoco.addEventListener("input", () => {
            localStorage.setItem(chaveNotas, notasFoco.value);
        });

        tempoFoco.addEventListener("change", () => {

            localStorage.setItem(chaveTempo, tempoFoco.value);

            if (!rodando) {
                resetTimer();
            }

        });


        // ==================================================
        // DISTRAÇÕES
        // ==================================================

        let distracoes = [];

        try {

            const salvas = localStorage.getItem(chaveDistancias);

            if (salvas) {
                distracoes = JSON.parse(salvas);
            }

        } catch (erro) {

            distracoes = [];

        }


        function salvarDistracoes() {
            localStorage.setItem(
                chaveDistancias,
                JSON.stringify(distracoes)
            );
        }


        function atualizarContadorDistracoes() {
            contadorDistracoes.textContent = `Hoje: ${distracoes.length}`;
        }


        function renderizarDistracoes() {

            listaDistracoes.innerHTML = "";


            distracoes.forEach((texto, indice) => {

                const li = document.createElement("li");

                li.style.display = "flex";
                li.style.justifyContent = "space-between";
                li.style.alignItems = "center";
                li.style.padding = "6px 0";
                li.style.borderBottom = "1px solid #eee";


                const span = document.createElement("span");
                span.textContent = "🚫 " + texto;
                span.style.fontSize = "14px";


                const btnRemover = document.createElement("button");
                btnRemover.type = "button";
                btnRemover.textContent = "×";
                btnRemover.title = "Remover";
                btnRemover.style.background = "none";
                btnRemover.style.border = "none";
                btnRemover.style.cursor = "pointer";
                btnRemover.style.fontSize = "20px";
                btnRemover.style.color = "#999";
                btnRemover.style.padding = "0 8px";


                btnRemover.addEventListener("click", () => {

                    distracoes.splice(indice, 1);
                    salvarDistracoes();
                    renderizarDistracoes();
                    atualizarContadorDistracoes();

                });


                li.appendChild(span);
                li.appendChild(btnRemover);

                listaDistracoes.appendChild(li);

            });

            atualizarContadorDistracoes();

        }


        function adicionarDistracao() {

            const texto = inputDistracao.value.trim();

            if (!texto) return;

            distracoes.push(texto);
            salvarDistracoes();
            renderizarDistracoes();

            inputDistracao.value = "";
            inputDistracao.focus();
        }


        btnAddDistracao.addEventListener("click", adicionarDistracao);

        inputDistracao.addEventListener("keydown", (evento) => {

            if (evento.key === "Enter") {

                evento.preventDefault();
                adicionarDistracao();

            }

        });


        // ==================================================
        // PAUSAS — CATEGORIAS
        // ==================================================

        let categoriaAtiva = "curta";

        const botoesPausa = document.querySelectorAll(".btn-pausa");


        function renderizarPausas(categoria) {

            categoriaAtiva = categoria;

            listaPausas.innerHTML = "";

            const itens = pausas[categoria] || [];


            itens.forEach(item => {

                const div = document.createElement("div");

                div.className = "item-pausa";
                div.textContent = item;

                listaPausas.appendChild(div);

            });


            botoesPausa.forEach(btn => {

                btn.classList.toggle(
                    "ativo",
                    btn.dataset.cat === categoria
                );

            });

        }


        botoesPausa.forEach(btn => {

            btn.addEventListener("click", () => {

                renderizarPausas(btn.dataset.cat);

            });

        });


        // ==================================================
        // SORTEIO DENTRO DA CATEGORIA ATIVA
        // ==================================================

        btnSorteio.addEventListener("click", () => {

            const listaAtual = pausas[categoriaAtiva] || [];

            if (listaAtual.length === 0) return;

            const escolhida =
                listaAtual[Math.floor(Math.random() * listaAtual.length)];

            resultadoSorteio.style.display = "block";

            resultadoSorteio.innerHTML =
                `🎲 <strong>Faça agora:</strong><br><br>${escolhida}`;

        });


        // ==================================================
        // INICIALIZA
        // ==================================================

        restaurarEstado();

        atualizarDisplay();
        atualizarBarra();
        atualizarTitulo();
        renderizarDistracoes();
        renderizarPausas("curta");

        if (rodando) {
            intervalId = setInterval(tick, 1000);
        }

    </script>

</body>
</html>
