<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agora</title>

    <link rel="stylesheet" href="../../css/style.css">

    <style>
        .campo-label {
            display: block;
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .chip {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #333338;
            background: #1a1a1e;
            color: #bbb;
            border-radius: 14px;
            transition: 0.15s;
            user-select: none;
            min-width: 80px;
            text-align: center;
        }

        .chip:hover {
            background: #222228;
            color: #e0e0e0;
            transform: translateY(-1px);
        }

        .chip.selecionado {
            background: #333;
            border-color: #666;
            color: #fff;
            box-shadow: 0 0 0 1px #55555c inset;
        }

        .btn-comecar {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #2c3a55;
            background: linear-gradient(135deg, #1a2235 0%, #2c3a55 100%);
            color: #dfe8ff;
            border-radius: 14px;
            letter-spacing: 1px;
            transition: 0.2s;
            margin-top: 22px;
        }

        .btn-comecar:hover {
            border-color: #5a7ab5;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(90, 122, 181, 0.2);
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">PRÓXIMO PASSO</p>
            <h1>⚡ Agora</h1>
            <p class="subtitle">
                Tire-se da indecisão e comece.
            </p>
        </header>

        <section class="modules">

            <div class="module-card" style="align-items: flex-start;">
                <span class="icon">🎯</span>
                <div style="width: 100%;">
                    <h2>O que vou fazer?</h2>
                    <p style="color:#888; font-size:13px; margin: 6px 0 12px;">
                        Uma ação concreta. Pequena o suficiente para começar já.
                    </p>
                    <input
                        type="text"
                        id="acaoAgora"
                        placeholder="Ex.: abrir o DaVinci e importar os vídeos."
                        autofocus
                    >
                </div>
            </div>


            <div class="module-card" style="align-items: flex-start;">
                <div style="width: 100%;">
                    <label class="campo-label">⏱️ Quanto tempo?</label>
                    <div class="chips" id="chipsTempo">
                        <div class="chip" data-valor="5">5 min</div>
                        <div class="chip" data-valor="15">15 min</div>
                        <div class="chip" data-valor="30">30 min</div>
                        <div class="chip" data-valor="50">50 min</div>
                        <div class="chip" data-valor="90">90 min</div>
                    </div>

                    <button
                        type="button"
                        id="btnComecar"
                        class="btn-comecar"
                    >
                        ▶️ COMEÇAR
                    </button>
                </div>
            </div>

        </section>

        <a href="index.html" class="back-button">
            ← Voltar para Próximo Passo
        </a>

    </main>


    <script>
        const chaveAcao   = "planejamento_pp_agora_acao";
        const chaveTempo  = "planejamento_pp_agora_tempo";

        const acaoAgora  = document.getElementById("acaoAgora");
        const chipsTempo = document.getElementById("chipsTempo");
        const btnComecar = document.getElementById("btnComecar");

        // Carrega valores salvos
        acaoAgora.value = localStorage.getItem(chaveAcao) || "";
        const tempoSalvo = localStorage.getItem(chaveTempo);

        const chips = chipsTempo.querySelectorAll(".chip");
        let tempoSelecionado = tempoSalvo || "15";

        chips.forEach(chip => {
            if (chip.dataset.valor === tempoSelecionado) {
                chip.classList.add("selecionado");
            }

            chip.addEventListener("click", () => {
                chips.forEach(c => c.classList.remove("selecionado"));
                chip.classList.add("selecionado");
                tempoSelecionado = chip.dataset.valor;
                localStorage.setItem(chaveTempo, tempoSelecionado);
            });
        });

        acaoAgora.addEventListener("input", () => {
            localStorage.setItem(chaveAcao, acaoAgora.value);
        });

        btnComecar.addEventListener("click", () => {

            const texto = acaoAgora.value.trim();

            if (!texto) {
                alert("Escreva o que você vai fazer.");
                acaoAgora.focus();
                return;
            }

            // Salva tempo para o Foco ler
            localStorage.setItem("planejamento_foco_tempo_preferido", tempoSelecionado);

            // Redireciona para o Foco com a tarefa
            window.location.href =
                `../foco/foco.html?tarefa=${encodeURIComponent(texto)}&tempo=${tempoSelecionado}`;
        });
    </script>

</body>
</html>
