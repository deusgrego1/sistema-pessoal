<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Corpo</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">PLANEJAMENTO</p>
            <h1>🏋️ Corpo</h1>
            <p class="subtitle">
                Planeje o cuidado com seu corpo hoje.
            </p>
        </header>

        <section class="modules">

            <div class="module-card">
                <span class="icon">🏋️</span>
                <div>
                    <h2>Treino</h2>
                    <p>O treino será registrado no Hevy.</p>

                    <a
                        href="#"
                        class="back-button"
                        style="display:inline-block; margin-top:12px;"
                    >
                        🏋️ Abrir treino no Hevy
                    </a>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">🏃</span>
                <div>
                    <h2>Cardio</h2>

                    <input
                        type="text"
                        placeholder="Tipo — corrida, caminhada, bicicleta..."
                    >

                    <input
                        type="text"
                        placeholder="Distância"
                    >

                    <input
                        type="text"
                        placeholder="Tempo previsto"
                    >

                    <select>
                        <option value="">Intensidade</option>
                        <option>Leve</option>
                        <option>Moderada</option>
                        <option>Intensa</option>
                    </select>

                    <textarea
                        placeholder="🎯 Objetivo do cardio"
                        rows="3"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">🍽️</span>
                <div>
                    <h2>Alimentação</h2>

                    <textarea
                        placeholder="🎯 Objetivo alimentar"
                        rows="3"
                    ></textarea>

                    <textarea
                        placeholder="🍳 Refeições — primeira, almoço, lanche, jantar..."
                        rows="4"
                    ></textarea>

                    <textarea
                        placeholder="🥗 Atenção — proteína, frutas/vegetais, ultraprocessados..."
                        rows="4"
                    ></textarea>

                    <input
                        type="text"
                        placeholder="⏳ Jejum planejado — início / fim / duração"
                    >

                    <input
                        type="text"
                        placeholder="💧 Água planejada"
                    >
                </div>
            </div>

            <div class="module-card">
                <span class="icon">😴</span>
                <div>
                    <h2>Sono anterior</h2>
                    <input
                        type="text"
                        placeholder="Quanto dormi na noite anterior?"
                    >
                </div>
            </div>

        </section>

        <a href="index.html" class="back-button">
            ← Voltar para Planejamento
        </a>

   <script src="../../js/app.js"></script>
    
</body>
</html>
