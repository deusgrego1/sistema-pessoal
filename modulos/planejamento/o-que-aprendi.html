<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O que aprendi</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">ESTUDO</p>
            <h1>🧠 O que aprendi</h1>
            <p class="subtitle">
                Registre o que realmente ficou de cada assunto estudado.
            </p>
        </header>


        <section class="modules">


            <!-- APRENDIZADO 1 -->

            <div class="module-card">

                <span class="icon">1️⃣</span>

                <div>

                    <h2>Aprendizado 1</h2>

                    <input
                        type="text"
                        placeholder="📌 Assunto"
                    >

                    <textarea
                        placeholder="💡 O que aprendi? Explique com suas próprias palavras."
                        rows="5"
                    ></textarea>

                    <textarea
                        placeholder="⭐ Principal insight"
                        rows="3"
                    ></textarea>

                    <textarea
                        placeholder="🔗 Com o que isso se conecta?"
                        rows="3"
                    ></textarea>

                    <textarea
                        placeholder="🛠️ Como posso aplicar?"
                        rows="3"
                    ></textarea>

                    <textarea
                        placeholder="❓ O que ainda não entendi?"
                        rows="3"
                    ></textarea>

                    <textarea
                        placeholder="🎯 Próxima ação"
                        rows="3"
                    ></textarea>

                </div>

            </div>


            <!-- APRENDIZADO 2 -->

                <span class="icon">2️⃣</span>

                    <input
                        type="text"
                        placeholder="📌 Assunto"
                    >

                    <textarea
                        placeholder="💡 O que aprendi? Explique com suas próprias palavras."

                    ></textarea>

                    <textarea
                        placeholder="⭐ Principal insight"
                        rows="3"
                    ></textarea>

                    <textarea
                        placeholder="🔗 Com o que isso se conecta?"
                        rows="3"
                    ></textarea>

                    <textarea
                        placeholder="🛠️ Como posso aplicar?"
                        rows="3"
                    ></textarea>

                    <textarea
                        placeholder="❓ O que ainda não entendi?"
                        rows="3"
                    ></textarea>

                    <textarea
                        placeholder="🎯 Próxima ação"
                        rows="3"
                    ></textarea>

                </div>

            </div>


            <!-- APRENDIZADO 3 -->

            <div class="module-card">

                <span class="icon">3️⃣</span>

                <div>

                    <input

                        placeholder="📌 Assunto"
                    >

                    <textarea
                        placeholder="💡 O que aprendi? Explique com suas próprias palavras."

                    ></textarea>

                    <textarea

                    ></textarea>

                    <textarea

                    <textarea

                    ></textarea>

                    <textarea

                        rows="3"
                    ></textarea>

                    <textarea
                        placeholder="🎯 Próxima ação"
                        rows="3"
                    ></textarea>

                </div>

            </div>


            <!-- ADICIONAR -->

            <button
                type="button"
                class="back-button"
                id="adicionarAprendizado"
            >
                ＋ Adicionar outro aprendizado
            </button>

        </section>


        <a href="estudo.html" class="back-button">
            ← Voltar para Estudo
        </a>


    </main>

    <script>
    const container = document.querySelector(".modules");
    const botao = document.getElementById("adicionarAprendizado");

    let numeroAprendizado = 3;

    botao.addEventListener("click", () => {

        numeroAprendizado++;

        const bloco = document.createElement("div");

        bloco.className = "module-card";

        bloco.innerHTML = `
            <span class="icon">🧠</span>

            <div>

                <h2>Aprendizado ${numeroAprendizado}</h2>

                <input
                    type="text"
                    placeholder="📌 Assunto"
                >

                <textarea
                    placeholder="💡 O que aprendi? Explique com suas próprias palavras."
                    rows="5"
                ></textarea>

                <textarea
                    placeholder="⭐ Principal insight"
                    rows="3"
                ></textarea>

                <textarea
                    placeholder="🔗 Com o que isso se conecta?"
                    rows="3"
                ></textarea>

                <textarea
                    placeholder="🛠️ Como posso aplicar?"
                    rows="3"
                ></textarea>

                <textarea
                    placeholder="❓ O que ainda não entendi?"
                    rows="3"
                ></textarea>

                <textarea
                    placeholder="🎯 Próxima ação"
                    rows="3"
                ></textarea>

            </div>
        `;

        container.insertBefore(bloco, botao);

    });
</script>

    <script src="../../js/app.js"></script>

</body>
</html>
