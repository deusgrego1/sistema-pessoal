<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notas / Ideias</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">PLANEJAMENTO</p>
            <h1>🧠 Notas / Ideias</h1>
            <p class="subtitle">
                Registre pensamentos, ideias e coisas para investigar.
            </p>
        </header>

        <section class="modules">

            <div class="module-card">
                <span class="icon">💡</span>
                <div>
                    <h2>Ideias</h2>
                    <textarea
                        placeholder="Registre ideias que surgirem durante o dia..."
                        rows="6"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">📝</span>
                <div>
                    <h2>Notas</h2>
                    <textarea
                        placeholder="Anotações, pensamentos ou informações importantes..."
                        rows="6"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">🔗</span>
                <div>
                    <h2>Pesquisar depois</h2>
                    <textarea
                        placeholder="Coisas que quero pesquisar ou investigar depois..."
                        rows="6"
                    ></textarea>
                </div>
            </div>

        </section>

        <a href="index.html" class="back-button">
            ← Voltar para Planejamento
        </a>

    <script src="../../js/app.js"></script>

</body>
</html>
