<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trabalho</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">PLANEJAMENTO</p>
            <h1>💼 Trabalho</h1>
            <p class="subtitle">
                Organize como você vai executar sua frente de trabalho.
            </p>
        </header>

        <section class="modules">

            <div class="module-card">
                <span class="icon">🎯</span>
                <div>
                    <h2>Objetivo do trabalho</h2>
                    <textarea
                        placeholder="O que quero alcançar com o trabalho hoje?"
                        rows="4"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">📋</span>
                <div>
                    <h2>Tarefas</h2>
                    <textarea
                        placeholder="Quais tarefas precisam ser executadas?"
                        rows="5"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">➡️</span>
                <div>
                    <h2>Próxima ação</h2>
                    <textarea
                        placeholder="Qual é a próxima ação concreta?"
                        rows="3"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">💡</span>
                <div>
                    <h2>Ideias / observações</h2>
                    <textarea
                        placeholder="Registre ideias, observações ou informações importantes."
                        rows="4"
                    ></textarea>
                </div>
            </div>

        </section>

        <a href="index.html" class="back-button">
            ← Voltar para Planejamento
        </a>

    </main>

</body>
</html>
