<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Espiritualidade</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">PLANEJAMENTO</p>
            <h1>🙏 Espiritualidade</h1>
            <p class="subtitle">
                Tempo com Deus, reflexão e aprendizado.
            </p>
        </header>

        <section class="modules">

            <div class="module-card">
                <span class="icon">🙏</span>
                <div>
                    <h2>Tempo com Deus</h2>
                    <textarea
                        placeholder="Como será meu tempo com Deus hoje?"
                        rows="4"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">📖</span>
                <div>
                    <h2>Leitura / Devocional</h2>
                    <textarea
                        placeholder="O que vou ler ou estudar?"
                        rows="4"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">💭</span>
                <div>
                    <h2>Reflexão</h2>
                    <textarea
                        placeholder="O que quero refletir hoje?"
                        rows="4"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">🧠</span>
                <div>
                    <h2>O que aprendi hoje</h2>
                    <textarea
                        placeholder="Registre o principal aprendizado espiritual do dia."
                        rows="4"
                    ></textarea>
                </div>
            </div>

        </section>

        <a href="index.html" class="back-button">
            ← Voltar para Planejamento
        </a>

    <script src="../../js/app.js"></script>

</body>
</html>
