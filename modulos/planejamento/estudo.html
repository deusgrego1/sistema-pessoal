        function salvarPrefs() {
            salvarPrefsGdelt({
                idioma:  estado.gdeltIdioma,
                pais:    estado.gdeltPais,
                periodo: estado.gdeltPeriodo,
                ordem:   estado.gdeltOrdem,
                dominio: estado.gdeltDominio,
            });
        }

        const inputBusca = wrap.querySelector("#gdeltBusca");
        inputBusca.addEventListener("input", e => { estado.gdeltBusca = e.target.value; });
        inputBusca.addEventListener("keydown", e => {
            if (e.key === "Enter") executarBuscaGdelt();
        });

        wrap.querySelector("#gdeltBtnBuscar").addEventListener("click", () => executarBuscaGdelt());

        wrap.querySelectorAll("[data-hist-gdelt]").forEach(btn => {
            btn.addEventListener("click", () => {
                estado.gdeltBusca = btn.dataset.histGdelt;
                inputBusca.value = estado.gdeltBusca;
                executarBuscaGdelt();
            });
        });

        wrap.querySelectorAll("[data-gdelt-idioma]").forEach(chip => {
            chip.addEventListener("click", () => {
                estado.gdeltIdioma = chip.dataset.gdeltIdioma;
                wrap.querySelectorAll("[data-gdelt-idioma]").forEach(c => c.classList.toggle("selecionado", c === chip));
                salvarPrefs();
                if (estado.gdeltBusca) executarBuscaGdelt();
            });
        });

        wrap.querySelectorAll("[data-gdelt-pais]").forEach(chip => {
            chip.addEventListener("click", () => {
                estado.gdeltPais = chip.dataset.gdeltPais;
                wrap.querySelectorAll("[data-gdelt-pais]").forEach(c => c.classList.toggle("selecionado", c === chip));
                salvarPrefs();
                if (estado.gdeltBusca) executarBuscaGdelt();
            });
        });

        wrap.querySelectorAll("[data-gdelt-periodo]").forEach(chip => {
            chip.addEventListener("click", () => {
                estado.gdeltPeriodo = chip.dataset.gdeltPeriodo;
                wrap.querySelectorAll("[data-gdelt-periodo]").forEach(c => c.classList.toggle("selecionado", c === chip));
                salvarPrefs();
                if (estado.gdeltBusca) executarBuscaGdelt();
            });
        });

        wrap.querySelectorAll("[data-gdelt-ordem]").forEach(chip => {
            chip.addEventListener("click", () => {
                estado.gdeltOrdem = chip.dataset.gdeltOrdem;
                wrap.querySelectorAll("[data-gdelt-ordem]").forEach(c => c.classList.toggle("selecionado", c === chip));
                salvarPrefs();
                if (estado.gdeltBusca) executarBuscaGdelt();
            });
        });

        wrap.querySelectorAll("[data-gdelt-modo]").forEach(chip => {
            chip.addEventListener("click", () => {
                estado.gdeltModo = chip.dataset.gdeltModo;
                wrap.querySelectorAll("[data-gdelt-modo]").forEach(c => c.classList.toggle("selecionado", c === chip));
                if (estado.gdeltBusca) executarBuscaGdelt();
            });
        });

        const inputDom = wrap.querySelector("#gdeltDominio");
        inputDom.addEventListener("input", e => { estado.gdeltDominio = e.target.value; });
        inputDom.addEventListener("keydown", e => {
            if (e.key === "Enter") { salvarPrefs(); if (estado.gdeltBusca) executarBuscaGdelt(); }
        });
        inputDom.addEventListener("blur", () => salvarPrefs());

        async function executarBuscaGdelt() {
            const q = estado.gdeltBusca.trim();
            if (!q) return;

            const box = wrap.querySelector("#gdeltResultados");

            if (estado.gdeltModo === "timeline") {
                box.innerHTML = `<div style="color:#888;font-size:13px;padding:20px;text-align:center;">Carregando linha do tempo…</div>`;
                try {
                    const pontos = await buscarGDELTTimeline(q, {
                        idioma:  estado.gdeltIdioma,
                        pais:    estado.gdeltPais,
                        periodo: estado.gdeltPeriodo,
                    });
                    salvarBuscaGdelt(q);
                    if (!pontos.length) {
                        box.innerHTML = `<div class="vazio">Nada encontrado no período.</div>`;
                        return;
                    }
                    const max = Math.max(...pontos.map(p => p.valor), 1);
                    box.innerHTML = `
                        <div style="margin-top:8px;">
                            <div style="font-size:12px;color:#888;margin-bottom:6px;">
                                Volume de notícias sobre <strong style="color:#eaeaea;">"${esc(q)}"</strong> no período
                            </div>
                            <div class="gdelt-timeline">
                                ${pontos.map(p => {
                                    const pct = Math.max(2, Math.round((p.valor / max) * 100));
                                    const d = p.data ? String(p.data).slice(0, 8) : "";
                                    const dataFmt = d ? `${d.slice(6,8)}/${d.slice(4,6)}` : "";
                                    return `<div class="barra" style="height:${pct}%;" title="${dataFmt} — ${p.valor} ${p.valor === 1 ? "notícia" : "notícias"}"></div>`;
                                }).join("")}
                            </div>
                            <div style="font-size:11px;color:#666;text-align:center;">
                                pico: ${max} ${max === 1 ? "notícia" : "notícias"} · ${pontos.length} ponto(s)
                            </div>
                        </div>
                    `;
                            } catch (e) {
                console.error(e);
                if (e.message === "RATE_LIMIT") {
                    box.innerHTML = `
                        <div class="vazio">
                            ⏳ O GDELT está limitando as buscas.<br>
                            <span style="font-size:13px;color:#666;">

                console.error(e);
                box.innerHTML = `<div class="vazio">Erro ao buscar. Tente outro filtro.</div>`;

        }

        if (estado.gdeltBusca) executarBuscaGdelt();

    function registrarNaBiblioteca(item, pct) {
        if (!item.titulo && !item.tema) return;
        const id = item.koodoId || item.link || (item.titulo + "|" + item.tema).toLowerCase();
        const existente = Storage.biblioteca.listar("livro").find(x => x.id === id);

        const agoraConcluido = pct >= 100;
        const jaConcluido    = existente?.status === "concluido";

        let novoStatus = existente?.status || "lendo";
        if (agoraConcluido)                  novoStatus = "concluido";
        else if (novoStatus === "concluido") novoStatus = "lendo";

        const patch = {
            id, tema: item.tema, titulo: item.titulo || item.tema,
            autor: item.autor, koodoId: item.koodoId, link: item.link,
            paginaAtual: item.paginaAtual, totalPaginas: item.totalPaginas,
            pct, status: novoStatus, capa: existente?.capa || "",
        };

        if (agoraConcluido && !jaConcluido)      patch.concluidoEm = Date.now();
        else if (!agoraConcluido && jaConcluido) patch.concluidoEm = null;

        Storage.biblioteca.adicionar("livro", patch);
    }

                (b.tema || "").toLowerCase().includes(q));

            estado.apBusca = e.target.value;
            renderAprendizados();
            const i = wrap.querySelector("#apBusca");
            if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
        });

        wrap.querySelector("#btnNovoAp").addEventListener("click", () => abrirFormAp());

        const listaEl = wrap.querySelector("#listaAp");
        if (lista.length === 0) {
            listaEl.innerHTML = `<div class="vazio">Nenhum aprendizado registrado.</div>`;
            return;
        }

        listaEl.innerHTML = lista.map(a => {
            const tipoInfo = TIPOS_AP.find(t => t.id === a.tipo)?.label || "";
            const impInfo = IMPACTOS_AP.find(t => t.id === a.impacto)?.label || "";
            const stInfo = STATUS_AP.find(t => t.id === a.status)?.label || "";
            const areas = (a.areas || []).map(x =>
                AREAS_AP.find(ar => ar.id === x)?.label || x).join(" · ");
            return `
                <div class="ap-card">
                    <div class="ap-linha-1">
                        <span>${esc(tipoInfo)}</span>
                        ${impInfo ? `<span>· ${esc(impInfo)}</span>` : ""}
                        ${areas ? `<span>· ${esc(areas)}</span>` : ""}
                    </div>
                    <div class="ap-texto">${esc(a.texto || "")}</div>
                    ${a.fonte ? `<div class="ap-fonte">— ${esc(a.fonte)}</div>` : ""}
                    <div class="ap-rodape">
                        ${stInfo ? `<span class="tag">${esc(stInfo)}</span>` : ""}
                        <button class="btn-secundario" data-rm="${a.id}" style="margin-left:auto;">remover</button>
                    </div>
                </div>
            `;
        }).join("");

        listaEl.querySelectorAll("[data-rm]").forEach(b => {
            b.addEventListener("click", () => {
                Storage.aprendizados.remover(b.dataset.rm);
                render();
            });
        });
    }

    function abrirFormAp() {
        const box = el("formAp");
        box.style.display = "block";

        box.innerHTML = `
            <div class="bloco-estudo">
                <div class="bloco-cabecalho">
                    <span class="bloco-titulo">Novo aprendizado</span>
                    <button class="bloco-remover" id="fecharForm">×</button>
                </div>
                <label class="campo-label">Texto do aprendizado</label>
                <textarea id="apTexto" rows="3" placeholder="Frase, insight, técnica…"></textarea>
                <label class="campo-label">Fonte (opcional)</label>
                <input type="text" id="apFonte" placeholder='Ex.: "Marketing 4.0, pág. 47"'>
                <label class="campo-label">Tipo</label>
                <div class="chips" id="chipsTipoAp"></div>
                <label class="campo-label">Áreas de aplicação</label>
                <div class="chips" id="chipsAreasAp"></div>
                <label class="campo-label">Impacto se aplicado</label>
                <div class="chips" id="chipsImpactoAp"></div>
                <label class="campo-label">Status</label>
                <div class="chips" id="chipsStatusAp"></div>
                <div style="margin-top:16px;text-align:right;">
                    <button class="btn-primario" id="salvarAp">Salvar</button>
                </div>
            </div>
        `;

        const tmp = { tipo: "", areas: [], impacto: "", status: "" };

        function renderChips(container, lista, multi, campo, classe) {
            container.innerHTML = lista.map(item =>
                `<div class="chip ${classe || ""}" data-id="${item.id}">${item.label}</div>`
            ).join("");
            container.querySelectorAll(".chip").forEach(c => {
                c.addEventListener("click", () => {
                    const id = c.dataset.id;
                    if (multi) {
                        const i = tmp[campo].indexOf(id);
                        if (i >= 0) tmp[campo].splice(i, 1);
                        else tmp[campo].push(id);
                        c.classList.toggle("selecionado");
                    } else {
                        container.querySelectorAll(".chip").forEach(x => x.classList.remove("selecionado"));
                        c.classList.add("selecionado");
                        tmp[campo] = id;
                    }
                });
            });
        }

        renderChips(box.querySelector("#chipsTipoAp"),    TIPOS_AP,    false, "tipo");
        renderChips(box.querySelector("#chipsAreasAp"),   AREAS_AP,    true,  "areas");
        renderChips(box.querySelector("#chipsImpactoAp"), IMPACTOS_AP, false, "impacto", "impacto-");
        renderChips(box.querySelector("#chipsStatusAp"),  STATUS_AP,   false, "status");

        box.querySelector("#fecharForm").addEventListener("click", () => {
            box.style.display = "none";
            box.innerHTML = "";
        });

        box.querySelector("#salvarAp").addEventListener("click", () => {
            const texto = box.querySelector("#apTexto").value.trim();
            if (!texto) return alert("Escreva o aprendizado.");
            Storage.aprendizados.adicionar({
                texto,
                fonte: box.querySelector("#apFonte").value.trim(),
                tipo: tmp.tipo,
                areas: tmp.areas,
                impacto: tmp.impacto,
                status: tmp.status || "capturado",
            });
            box.style.display = "none";
            box.innerHTML = "";
            render();
        });
    }

    // ==================================================
    // RENDER GERAL
    // ==================================================
    function render() {
        renderResumo();
        renderTipos();
        renderSubAbas();
        renderConteudo();
    }

    render();
</script>
</body>
</html>
