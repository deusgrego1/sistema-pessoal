<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estudo</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">PLANEJAMENTO</p>
            <h1>📚 Estudo</h1>
            <p class="subtitle">
                Defina o que você vai estudar e por quê.
            </p>
        </header>

        <section class="modules">

            <div class="module-card">
                <span class="icon">📌</span>
                <div>
                    <h2>Tema</h2>
                    <textarea
                        placeholder="O que vou estudar?"
                        rows="3"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">🎯</span>
                <div>
                    <h2>Objetivo do estudo</h2>
                    <textarea
                        placeholder="O que quero conseguir entender ou aprender?"
                        rows="4"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">📖</span>
                <div>
                    <h2>Fonte / material</h2>
                    <textarea
                        placeholder="Livro, curso, vídeo, artigo, aula ou outro material."
                        rows="3"
                    ></textarea>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">⏱️</span>
                <div>
                    <h2>Tempo</h2>
                    <input
                        type="text"
                        placeholder="Ex.: 1h30"
                    >
                </div>
            </div>

            <a href="aprendizado.html" class="module-card">
                <span class="icon">🧠</span>
                <div>
                    <h2>O que aprendi</h2>
                    <p>Registre, explique e aplique o que aprendeu.</p>
                </div>
                <span class="arrow">›</span>
            </a>

        </section>

        <a href="index.html" class="back-button">
            ← Voltar para Planejamento
        </a>

    </main>

</body>
</html>
