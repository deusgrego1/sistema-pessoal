<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">PLANEJAMENTO</p>
            <h1 id="tituloHistorico">📅 Histórico</h1>
            <p class="subtitle" id="subtituloHistorico">
                Consulte seus planejamentos anteriores.
            </p>
        </header>

        <section id="listaHistorico" class="modules">

            <div class="module-card">
                <span class="icon">🔎</span>
                <div>
                    <h2>Buscar data</h2>

                    <input
                        type="date"
                        id="buscarData"
                    >
                </div>
            </div>

            <div id="listaDatas"></div>

        </section>

        <section id="visualizacaoDia" class="modules" style="display:none;">

            <div class="module-card">
                <span class="icon">☀️</span>
                <div>
                    <h2>Visão do Dia</h2>
                    <div id="visaoHistorico"></div>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">🎯</span>
                <div>
                    <h2>Prioridades</h2>
                    <div id="prioridadesHistorico"></div>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">💼</span>
                <div>
                    <h2>Trabalho</h2>
                    <div id="trabalhoHistorico"></div>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">📚</span>
                <div>
                    <h2>Estudo</h2>
                    <div id="estudoHistorico"></div>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">🏋️</span>
                <div>
                    <h2>Corpo</h2>
                    <div id="corpoHistorico"></div>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">🙏</span>
                <div>
                    <h2>Espiritualidade</h2>
                    <div id="espiritualidadeHistorico"></div>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">🧠</span>
                <div>
                    <h2>Notas / Ideias</h2>
                    <div id="notasHistorico"></div>
                </div>
            </div>

        </section>

        <a href="index.html" class="back-button">
            ← Voltar para Planejamento
        </a>

    </main>

    <script src="../../js/app.js"></script>

</body>
</html>
