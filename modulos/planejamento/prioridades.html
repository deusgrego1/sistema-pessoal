<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prioridades</title>

    <link rel="stylesheet" href="../../css/style.css">

    <style>
        .module-card.concluida textarea {
            text-decoration: line-through;
            color: #777;
        }

        .module-card.concluida h2 {
            color: #777;
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">PLANEJAMENTO</p>
            <h1>🎯 Prioridades</h1>
            <p class="subtitle">
                O que realmente importa hoje.
            </p>
        </header>

        <section class="modules">

            <div class="module-card" data-prioridade="0">
                <span class="icon">1️⃣</span>
                <div>
                    <h2>Prioridade 1</h2>
                    <textarea
                        placeholder="O que precisa ser feito?"
                        rows="3"
                    ></textarea>

                    <label
                        style="
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            margin-top: 12px;
                            padding: 10px 14px;
                            border: 1px solid #252529;
                            border-radius: 8px;
                            cursor: pointer;
                            user-select: none;
                        "
                    >
                        <input
                            type="checkbox"
                            style="
                                width: 22px;
                                height: 22px;
                                cursor: pointer;
                                flex-shrink: 0;
                            "
                        >
                        <span>Concluída</span>
                    </label>

                    <button
                        type="button"
                        class="btn-focar"
                        style="
                            display: block;
                            margin-top: 12px;
                            padding: 8px 14px;
                            font-size: 14px;
                            cursor: pointer;
                            border: 1px solid #333;
                            border-radius: 8px;
                            background: #333;
                            color: #fff;
                        "
                    >
                        🎯 Focar nisso
                    </button>
                </div>
            </div>

            <div class="module-card" data-prioridade="1">
                <span class="icon">2️⃣</span>
                <div>
                    <h2>Prioridade 2</h2>
                    <textarea
                        placeholder="O que precisa ser feito?"
                        rows="3"
                    ></textarea>

                    <label
                        style="
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            margin-top: 12px;
                            padding: 10px 14px;
                            border: 1px solid #252529;
                            border-radius: 8px;
                            cursor: pointer;
                            user-select: none;
                        "
                    >
                        <input
                            type="checkbox"
                            style="
                                width: 22px;
                                height: 22px;
                                cursor: pointer;
                                flex-shrink: 0;
                            "
                        >
                        <span>Concluída</span>
                    </label>

                    <button
                        type="button"
                        class="btn-focar"
                        style="
                            display: block;
                            margin-top: 12px;
                            padding: 8px 14px;
                            font-size: 14px;
                            cursor: pointer;
                            border: 1px solid #333;
                            border-radius: 8px;
                            background: #333;
                            color: #fff;
                        "
                    >
                        🎯 Focar nisso
                    </button>
                </div>
            </div>

            <div class="module-card" data-prioridade="2">
                <span class="icon">3️⃣</span>
                <div>
                    <h2>Prioridade 3</h2>
                    <textarea
                        placeholder="O que precisa ser feito?"
                        rows="3"
                    ></textarea>

                    <label
                        style="
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            margin-top: 12px;
                            padding: 10px 14px;
                            border: 1px solid #252529;
                            border-radius: 8px;
                            cursor: pointer;
                            user-select: none;
                        "
                    >
                        <input
                            type="checkbox"
                            style="
                                width: 22px;
                                height: 22px;
                                cursor: pointer;
                                flex-shrink: 0;
                            "
                        >
                        <span>Concluída</span>
                    </label>

                    <button
                        type="button"
                        class="btn-focar"
                        style="
                            display: block;
                            margin-top: 12px;
                            padding: 8px 14px;
                            font-size: 14px;
                            cursor: pointer;
                            border: 1px solid #333;
                            border-radius: 8px;
                            background: #333;
                            color: #fff;
                        "
                    >
                        🎯 Focar nisso
                    </button>
                </div>
            </div>

            <button
                type="button"
                id="btnCopiarOntem"
                style="
                    display: block;
                    margin: 0 auto;
                    padding: 10px 18px;
                    font-size: 14px;
                    cursor: pointer;
                    border: 1px dashed #555;
                    border-radius: 8px;
                    background: transparent;
                    color: #aaa;
                "
            >
                📋 Copiar de ontem
            </button>

        </section>

        <a href="index.html" class="back-button">
            ← Voltar para Planejamento
        </a>

    </main>

    <script src="../../js/app.js"></script>

    <script>
        // ==================================================
        // BOTÃO "FOCAR NISSO"
        // ==================================================

        document.querySelectorAll(".btn-focar").forEach(botao => {

            botao.addEventListener("click", () => {

                const card = botao.closest(".module-card");
                const texto = card.querySelector("textarea").value.trim();

                if (!texto) {
                    alert("Escreva a prioridade antes de focar.");
                    return;
                }

                const url =
                    "../foco/foco.html?tarefa=" +
                    encodeURIComponent(texto);

                window.location.href = url;

            });

        });


        // ==================================================
        // EFEITO "CONCLUÍDA" — RISCA A PRIORIDADE
        // ==================================================

       document.querySelectorAll(".module-card[data-prioridade]").forEach(card => {

    const checkbox = card.querySelector("input[type=checkbox]");

    if (!checkbox) return;

    function atualizarVisual() {
        card.classList.toggle("concluida", checkbox.checked);
    }

    // Reaplica após o app.js terminar de restaurar do localStorage
    window.addEventListener("load", atualizarVisual);

    // Mantém ao vivo quando o usuário clica
    checkbox.addEventListener("change", atualizarVisual);

});


        // ==================================================
        // COPIAR DE ONTEM
        // ==================================================

        const paramsPrior = new URLSearchParams(window.location.search);
        const dataParamPrior = paramsPrior.get("data");

        const hojePrior = new Date();

        const dataBasePrior =
            (dataParamPrior && /^\d{4}-\d{2}-\d{2}$/.test(dataParamPrior))
                ? dataParamPrior
                : (() => {
                    const y = hojePrior.getFullYear();
                    const m = String(hojePrior.getMonth() + 1).padStart(2, "0");
                    const d = String(hojePrior.getDate()).padStart(2, "0");
                    return `${y}-${m}-${d}`;
                })();

        document
            .getElementById("btnCopiarOntem")
            .addEventListener("click", () => {

                if (!confirm(
                    "Copiar as prioridades de ontem para o dia exibido?\n\n" +
                    "Isso vai sobrescrever o que já estiver preenchido aqui."
                )) return;

                const copiados =
                    window.copiarDoDiaAnterior("prioridades", dataBasePrior);

                if (copiados === 0) {
                    alert("Nada encontrado para o dia anterior.");
                    return;
                }

                window.location.reload();

            });
    </script>

</body>
</html>
