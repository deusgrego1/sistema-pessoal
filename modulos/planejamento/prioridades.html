<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prioridades</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">PLANEJAMENTO</p>
            <h1>🎯 Prioridades</h1>
            <p class="subtitle">
                O que realmente importa hoje.
            </p>
        </header>

        <section class="modules">

            <div class="module-card">
                <span class="icon">1️⃣</span>
                <div>
                    <h2>Prioridade 1</h2>
                    <textarea
                        placeholder="O que precisa ser feito?"
                        rows="3"
                    ></textarea>

                    <label>
                        <input type="checkbox">
                        Concluída
                    </label>

                    <button
                        type="button"
                        class="btn-focar"
                        style="
                            display: block;
                            margin-top: 12px;
                            padding: 8px 14px;
                            font-size: 14px;
                            cursor: pointer;
                            border: 1px solid #333;
                            border-radius: 8px;
                            background: #333;
                            color: #fff;
                        "
                    >
                        🎯 Focar nisso
                    </button>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">2️⃣</span>
                <div>
                    <h2>Prioridade 2</h2>
                    <textarea
                        placeholder="O que precisa ser feito?"
                        rows="3"
                    ></textarea>

                    <label>
                        <input type="checkbox">
                        Concluída
                    </label>

                    <button
                        type="button"
                        class="btn-focar"
                        style="
                            display: block;
                            margin-top: 12px;
                            padding: 8px 14px;
                            font-size: 14px;
                            cursor: pointer;
                            border: 1px solid #333;
                            border-radius: 8px;
                            background: #333;
                            color: #fff;
                        "
                    >
                        🎯 Focar nisso
                    </button>
                </div>
            </div>

            <div class="module-card">
                <span class="icon">3️⃣</span>
                <div>
                    <h2>Prioridade 3</h2>
                    <textarea
                        placeholder="O que precisa ser feito?"
                        rows="3"
                    ></textarea>

                    <label>
                        <input type="checkbox">
                        Concluída
                    </label>

                    <button
                        type="button"
                        class="btn-focar"
                        style="
                            display: block;
                            margin-top: 12px;
                            padding: 8px 14px;
                            font-size: 14px;
                            cursor: pointer;
                            border: 1px solid #333;
                            border-radius: 8px;
                            background: #333;
                            color: #fff;
                        "
                    >
                        🎯 Focar nisso
                    </button>
                </div>
            </div>

        </section>

        <a href="index.html" class="back-button">
            ← Voltar para Planejamento
        </a>

    </main>

    <script src="../../js/app.js"></script>

    <script>
        // ==================================================
        // BOTÃO "FOCAR NISSO"
        // ==================================================

        document.querySelectorAll(".btn-focar").forEach(botao => {

            botao.addEventListener("click", () => {

                const card = botao.closest(".module-card");
                const texto = card.querySelector("textarea").value.trim();

                if (!texto) {
                    alert("Escreva a prioridade antes de focar.");
                    return;
                }

                const url =
                    "../foco/foco.html?tarefa=" +
                    encodeURIComponent(texto);

                window.location.href = url;

            });

        });
    </script>

</body>
</html>
