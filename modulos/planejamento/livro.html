<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Livros</title>

    <link rel="stylesheet" href="../../css/style.css">

    <style>
        .campo-label {
            display: block;
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 14px 0 8px;
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; }

        .chip {
            padding: 7px 13px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #333338;
            background: #1a1a1e;
            color: #bbb;
            border-radius: 16px;
            transition: 0.15s;
            user-select: none;
        }

        .chip:hover { background: #222228; color: #e0e0e0; }

        .chip.selecionado {
            background: #2e2e33; border-color: #666; color: #fff; font-weight: 600;
        }

        .chip.status-lendo.selecionado    { background: #332e1a; border-color: #c9a44a; color: #e0d48a; }
        .chip.status-pausado.selecionado  { background: #332a1a; border-color: #d4954a; color: #e0b878; }
        .chip.status-concluido.selecionado{ background: #1f3320; border-color: #4caf50; color: #a5d6a7; }

        .livro-card {
            background: #1c1c20;
            border: 1px solid #252529;
            border-left: 3px solid #555;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .livro-card.lendo     { border-left-color: #c9a44a; }
        .livro-card.pausado   { border-left-color: #d4954a; }
        .livro-card.concluido { border-left-color: #4caf50; }

        .livro-titulo {
            font-size: 15px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .livro-autor { font-size: 13px; color: #999; margin-bottom: 8px; }

        .progresso-barra {
            height: 6px;
            background: #252529;
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progresso-preenchido {
            height: 100%;
            background: #c9a44a;
        }

        .livro-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }

        .livro-takeaway {
            font-size: 13px;
            color: #bbb;
            padding: 8px 10px;
            background: #16161a;
            border-radius: 6px;
            margin-top: 8px;
            white-space: pre-wrap;
        }

        .btn-remover {
            background: none;
            border: none;
            color: #a33;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
            margin-top: 8px;
        }

        .btn-remover:hover { color: #e55; }

        .vazio { text-align: center; color: #777; font-size: 14px; padding: 30px 0; }

        .btn-primario {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #333;
            background: #2a2a30;
            color: #fff;
            border-radius: 12px;
            transition: 0.15s;
        }

        .btn-primario:hover { background: #333340; border-color: #555; }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">ESTUDO</p>
            <h1>📖 Livros</h1>
            <p class="subtitle">
                O que você está lendo e o que ficou de cada um.
            </p>
        </header>

        <section class="modules" id="lista"></section>

        <a href="estudo.html" class="back-button">
            ← Voltar para Estudo
        </a>

    </main>


    <script>
        const chave = "planejamento_estudo_livros";
        const STATUS = [
            { valor: "lendo",     label: "🟡 Lendo",     classe: "status-lendo" },
            { valor: "pausado",   label: "🟠 Pausado",   classe: "status-pausado" },
            { valor: "concluido", label: "🟢 Concluído", classe: "status-concluido" }
        ];

        let livros = [];
        try {
            const s = localStorage.getItem(chave);
            if (s) livros = JSON.parse(s);
        } catch (e) { livros = []; }

        function salvar() {
            localStorage.setItem(chave, JSON.stringify(livros));
            render();
        }

        const lista = document.getElementById("lista");

        function render() {

            lista.innerHTML = "";

            if (livros.length === 0) {
                const vazio = document.createElement("p");
                vazio.className = "vazio";
                vazio.textContent = "Nenhum livro registrado ainda.";
                lista.appendChild(vazio);
            } else {

                livros.forEach((l, i) => {

                    const div = document.createElement("div");
                    div.className = `livro-card ${l.status || ""}`;

                    div.innerHTML = `
                        <div class="livro-titulo">${l.titulo || "(sem título)"}</div>
                        ${l.autor ? `<div class="livro-autor">${l.autor}</div>` : ""}

                        ${(l.total || l.atual)
                            ? `<div class="progresso-barra">
                                   <div class="progresso-preenchido" style="width:${calcularPct(l)}%;"></div>
                               </div>
                               <div class="livro-info">
                                   <span>${l.atual || 0} / ${l.total || "?"}</span>
                                   <span>${calcularPct(l)}%</span>
                               </div>`
                            : ""}

                        ${l.takeaway
                            ? `<div class="livro-takeaway">${l.takeaway}</div>`
                            : ""}
                    `;

                    const btnRem = document.createElement("button");
                    btnRem.className = "btn-remover";
                    btnRem.textContent = "remover";
                    btnRem.addEventListener("click", () => {
                        if (!confirm(`Remover "${l.titulo}"?`)) return;
                        livros.splice(i, 1);
                        salvar();
                    });
                    div.appendChild(btnRem);

                    lista.appendChild(div);
                });
            }


            // Form de adicionar
            const form = document.createElement("div");
            form.className = "module-card";
            form.style.alignItems = "flex-start";

            form.innerHTML = `
                <span class="icon">➕</span>
                <div style="width: 100%;">
                    <h2>Adicionar livro</h2>

                    <label class="campo-label">Título</label>
                    <input type="text" id="novoTitulo" placeholder="Ex.: Hábitos Atômicos">

                    <label class="campo-label">Autor</label>
                    <input type="text" id="novoAutor" placeholder="Ex.: James Clear">

                    <label class="campo-label">Total de páginas</label>
                    <input type="text" id="novoTotal" placeholder="Ex.: 320">

                    <label class="campo-label">Página atual</label>
                    <input type="text" id="novoAtual" placeholder="Ex.: 150">

                    <label class="campo-label">Status</label>
                    <div class="chips" id="chipsStatus"></div>

                    <label class="campo-label">O que estou tirando do livro</label>
                    <textarea id="novoTakeaway" rows="4"
                        placeholder="Principais ideias, capítulos marcantes."></textarea>

                    <div style="margin-top: 18px;">
                        <button type="button" class="btn-primario" id="btnAdicionar">
                            ＋ Adicionar
                        </button>
                    </div>
                </div>
            `;

            lista.appendChild(form);

            let statusSel = null;
            const chipsStatus = document.getElementById("chipsStatus");
            STATUS.forEach(s => {
                const chip = document.createElement("div");
                chip.className = "chip" + (s.classe ? " " + s.classe : "");
                chip.textContent = s.label;
                chip.addEventListener("click", () => {
                    const jaSel = chip.classList.contains("selecionado");
                    chipsStatus.querySelectorAll(".chip").forEach(c => c.classList.remove("selecionado"));
                    if (jaSel) { statusSel = null; }
                    else { chip.classList.add("selecionado"); statusSel = s.valor; }
                });
                chipsStatus.appendChild(chip);
            });

            document.getElementById("btnAdicionar").addEventListener("click", () => {
                const titulo = document.getElementById("novoTitulo").value.trim();
                if (!titulo) { alert("Escreva o título."); return; }

                livros.push({
                    titulo,
                    autor: document.getElementById("novoAutor").value.trim(),
                    total: document.getElementById("novoTotal").value.trim(),
                    atual: document.getElementById("novoAtual").value.trim(),
                    status: statusSel,
                    takeaway: document.getElementById("novoTakeaway").value.trim()
                });

                salvar();
            });
        }

        function calcularPct(l) {
            const total = Number(l.total);
            const atual = Number(l.atual);
            if (!total || !atual) return 0;
            return Math.min(100, Math.round((atual / total) * 100));
        }

        render();
    </script>

</body>
</html>
