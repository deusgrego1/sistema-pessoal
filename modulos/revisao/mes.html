<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Revisão do Mês</title>

    <link rel="stylesheet" href="../../css/style.css">

    <style>
        .panorama-linha {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #252529;
            font-size: 14px;
        }

        .panorama-linha:last-child {
            border-bottom: none;
        }

        .panorama-label {
            color: #999;
        }

        .panorama-valor {
            color: #f5f5f5;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">REVISÃO</p>
            <h1>🗓️ Revisão do mês</h1>
            <p class="subtitle">
                Evolução, tendências e o que ajustar.
            </p>
        </header>

        <section class="modules">

            <!-- 1. PANORAMA DO MÊS -->

            <div class="module-card">
                <span class="icon">📊</span>
                <div style="width:100%;">
                    <h2>Panorama do mês</h2>
                    <div id="panorama" style="margin-top:12px;">
                        <p style="color:#777;">Carregando…</p>
                    </div>
                </div>
            </div>


            <!-- 2. CONQUISTAS -->

            <div class="module-card">
                <span class="icon">🏆</span>
                <div>
                    <h2>Principais conquistas</h2>
                    <textarea id="conquistas" rows="4"
                        placeholder="O que realmente avançou neste mês?"></textarea>
                </div>
            </div>


            <!-- 3. ONDE EVOLUÍ -->

            <div class="module-card">
                <span class="icon">📈</span>
                <div>
                    <h2>Onde evoluí</h2>
                    <textarea id="evolucao" rows="5"
                        placeholder="Trabalho, estudos, corpo, mente, projetos, relacionamentos..."></textarea>
                </div>
            </div>


            <!-- 4. DIFICULDADES -->

            <div class="module-card">
                <span class="icon">🚧</span>
                <div>
                    <h2>Principais dificuldades</h2>
                    <textarea id="dificuldades" rows="4"
                        placeholder="O que persistiu como obstáculo durante o mês?"></textarea>
                </div>
            </div>


            <!-- 5. PADRÕES -->

            <div class="module-card">
                <span class="icon">🔁</span>
                <div>
                    <h2>Padrões percebidos</h2>
                    <textarea id="padroes" rows="4"
                        placeholder="O que se repetiu ao longo das semanas?"></textarea>
                </div>
            </div>


            <!-- 6. APRENDIZADOS -->

            <div class="module-card">
                <span class="icon">🧠</span>
                <div>
                    <h2>Principais aprendizados</h2>
                    <textarea id="aprendizados" rows="4"
                        placeholder="Se pudesse levar só 3 aprendizados deste mês para o próximo, quais seriam?"></textarea>
                </div>
            </div>


            <!-- 7. NÃO FUNCIONOU -->

            <div class="module-card">
                <span class="icon">❌</span>
                <div>
                    <h2>O que não funcionou</h2>
                    <textarea id="naoFuncionou" rows="4"
                        placeholder="Estratégias, hábitos ou decisões que não deram o resultado esperado."></textarea>
                </div>
            </div>


            <!-- 8. O QUE DEVE MUDAR -->

            <div class="module-card">
                <span class="icon">🔧</span>
                <div>
                    <h2>O que deve mudar</h2>
                    <textarea id="mudar" rows="4"
                        placeholder="O que precisa ser diferente no próximo mês?"></textarea>
                </div>
            </div>

        </section>

        <a href="index.html" class="back-button">
            ← Voltar para Revisão
        </a>

    </main>


    <script>
        // ==================================================
        // DATA (respeita ?data=, ancora no mês)
        // ==================================================

        const hoje = new Date();

        const anoHoje = hoje.getFullYear();
        const mesHoje = String(hoje.getMonth() + 1).padStart(2, "0");
        const diaHoje = String(hoje.getDate()).padStart(2, "0");

        const dataHoje = `${anoHoje}-${mesHoje}-${diaHoje}`;

        const paramsURL = new URLSearchParams(window.location.search);
        const dataParam = paramsURL.get("data");

        const dataBase =
            (dataParam && /^\d{4}-\d{2}-\d{2}$/.test(dataParam))
                ? dataParam
                : dataHoje;


        // ----------------------------------------------
        // ANCORA NO MÊS (AAAA-MM)
        // ----------------------------------------------

        const [anoBase, mesBase] = dataBase.split("-").map(Number);

        const mesAncora = `${anoBase}-${String(mesBase).padStart(2, "0")}`;

        const mesAtualHoje = `${anoHoje}-${mesHoje}`;


        // ----------------------------------------------
        // LABEL DO MÊS
        // ----------------------------------------------

        const NOMES_MES = [
            "janeiro", "fevereiro", "março", "abril",
            "maio", "junho", "julho", "agosto",
            "setembro", "outubro", "novembro", "dezembro"
        ];

        function labelMes(mesISO) {
            const [y, m] = mesISO.split("-").map(Number);
            return `${NOMES_MES[m - 1]} de ${y}`;
        }


        // ----------------------------------------------
        // NAVEGAÇÃO
        // ----------------------------------------------

        function mesAnterior(mesISO) {
            let [y, m] = mesISO.split("-").map(Number);
            m--;
            if (m === 0) { m = 12; y--; }
            return `${y}-${String(m).padStart(2, "0")}`;
        }

        function mesSeguinte(mesISO) {
            let [y, m] = mesISO.split("-").map(Number);
            m++;
            if (m === 13) { m = 1; y++; }
            return `${y}-${String(m).padStart(2, "0")}`;
        }


        // ==================================================
        // BARRA DE NAVEGAÇÃO DE MESES
        // ==================================================

        (function inserirBarraMeses() {

            const container = document.querySelector("main.container");
            const header = container.querySelector(".header");

            const ant = mesAnterior(mesAncora);
            const seg = mesSeguinte(mesAncora);

            const baseURL = window.location.pathname;

            const urlComData = (mesISO) => {
                // Passa o dia 01 daquele mês como referência
                return `${baseURL}?data=${mesISO}-01`;
            };

            const ehMesAtual = (mesAncora === mesAtualHoje);

            const barra = document.createElement("div");

            barra.style.cssText = `
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                margin-bottom: 18px;
                padding: 10px 12px;
                border: 1px solid #252529;
                border-radius: 10px;
                background: #17171a;
                font-size: 14px;
            `;

            const linkStyle =
                "text-decoration:none; color:#e0e0e0; padding:6px 10px; border-radius:6px;";

            barra.innerHTML = `
                <a href="${urlComData(ant)}" style="${linkStyle}">
                    ← ${labelMes(ant)}
                </a>

                <div style="text-align:center;">
                    <div style="font-weight:600; color:#f5f5f5;">
                        ${labelMes(mesAncora)}
                    </div>

                    ${!ehMesAtual
                        ? `<a href="${baseURL}" style="font-size:11px; color:#c98a8a; text-decoration:none;">
                               voltar para este mês
                           </a>`
                        : ""}
                </div>

                <a href="${urlComData(seg)}" style="${linkStyle}">
                    ${labelMes(seg)} →
                </a>
            `;

            container.insertBefore(barra, header);

        })();


        // ==================================================
        // PANORAMA AUTOMÁTICO DO MÊS
        // ==================================================

        (function montarPanorama() {

            const [y, m] = mesAncora.split("-").map(Number);

            const ultimoDia = new Date(y, m, 0).getDate();

            const dias = [];

            for (let i = 1; i <= ultimoDia; i++) {
                dias.push(
                    `${y}-${String(m).padStart(2, "0")}-${String(i).padStart(2, "0")}`
                );
            }

            let diasPlanejados = 0;
            let diasRevisados = 0;
            let prioridadesConcluidas = 0;
            let totalPrioridades = 0;
            let sessoesFoco = 0;
            let tempoFocoTotal = 0;
            let distracoesTotais = 0;

            dias.forEach(data => {

                const chaves = Object.keys(localStorage);

                const temPlan = chaves.some(k =>
                    k.startsWith(`planejamento_${data}_`) &&
                    !k.includes(`_revisao_`) &&
                    !k.startsWith(`planejamento_semana_`) &&
                    !k.startsWith(`planejamento_mes_`)
                );
                if (temPlan) diasPlanejados++;

                const temRev = chaves.some(k =>
                    k.startsWith(`planejamento_${data}_revisao_`)
                );
                if (temRev) diasRevisados++;

                [0, 2, 4].forEach(i => {

                    const texto = localStorage.getItem(
                        `planejamento_${data}_prioridades_${i}`
                    );

                    const check = localStorage.getItem(
                        `planejamento_${data}_prioridades_${i + 1}`
                    );

                    if (texto && texto.trim()) {
                        totalPrioridades++;
                        if (check === "true") prioridadesConcluidas++;
                    }

                });

                const sessStr = localStorage.getItem(
                    `planejamento_${data}_foco_sessoes`
                );

                if (sessStr) {
                    try {
                        const arr = JSON.parse(sessStr);
                        sessoesFoco += arr.length;
                        arr.forEach(s => {
                            tempoFocoTotal += (s.duracao || 0);
                        });
                    } catch (e) {}
                }

                const distStr = localStorage.getItem(
                    `planejamento_${data}_foco_distancias`
                );

                if (distStr) {
                    try {
                        const arr = JSON.parse(distStr);
                        distracoesTotais += arr.length;
                    } catch (e) {}
                }

            });


            const horas = Math.floor(tempoFocoTotal / 3600);
            const minutos = Math.floor((tempoFocoTotal % 3600) / 60);

            let tempoTexto = "—";
            if (tempoFocoTotal > 0) {
                if (horas > 0) {
                    tempoTexto = `${horas}h ${minutos}min`;
                } else {
                    tempoTexto = `${minutos}min`;
                }
            }


            const taxa =
                totalPrioridades > 0
                    ? Math.round((prioridadesConcluidas / totalPrioridades) * 100)
                    : 0;


            const el = document.getElementById("panorama");

            el.innerHTML = `
                <div class="panorama-linha">
                    <span class="panorama-label">Dias planejados</span>
                    <span class="panorama-valor">${diasPlanejados} / ${ultimoDia}</span>
                </div>

                <div class="panorama-linha">
                    <span class="panorama-label">Dias revisados</span>
                    <span class="panorama-valor">${diasRevisados} / ${ultimoDia}</span>
                </div>

                <div class="panorama-linha">
                    <span class="panorama-label">Prioridades concluídas</span>
                    <span class="panorama-valor">${prioridadesConcluidas} / ${totalPrioridades} (${taxa}%)</span>
                </div>

                <div class="panorama-linha">
                    <span class="panorama-label">Sessões de foco</span>
                    <span class="panorama-valor">${sessoesFoco}</span>
                </div>

                <div class="panorama-linha">
                    <span class="panorama-label">Tempo total de foco</span>
                    <span class="panorama-valor">${tempoTexto}</span>
                </div>

                <div class="panorama-linha">
                    <span class="panorama-label">Distrações registradas</span>
                    <span class="panorama-valor">${distracoesTotais}</span>
                </div>
            `;

        })();


        // ==================================================
        // CAMPOS DE TEXTO
        // ==================================================

        const campos = [
            { id: "conquistas",   sufixo: "conquistas" },
            { id: "evolucao",     sufixo: "evolucao" },
            { id: "dificuldades", sufixo: "dificuldades" },
            { id: "padroes",      sufixo: "padroes" },
            { id: "aprendizados", sufixo: "aprendizados" },
            { id: "naoFuncionou", sufixo: "nao_funcionou" },
            { id: "mudar",        sufixo: "mudar" }
        ];

        campos.forEach(({ id, sufixo }) => {

            const campo = document.getElementById(id);
            const chave = `planejamento_mes_${mesAncora}_${sufixo}`;

            const salvo = localStorage.getItem(chave);
            if (salvo !== null) campo.value = salvo;

            const salvar = () => {
                localStorage.setItem(chave, campo.value);
            };

            campo.addEventListener("input", salvar);
            campo.addEventListener("change", salvar);

        });
    </script>

</body>
</html>
